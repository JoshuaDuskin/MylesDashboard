<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myles AI Runtime Dashboard</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-primary: #2c3e50;
            --text-secondary: #7f8c8d;
            --accent-color: #3498db;
            --success-color: #2ecc71;
            --warning-color: #f1c40f;
            --danger-color: #e74c3c;
            --border-radius: 8px;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 2rem;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #e0e0e0;
        }

        h1 { font-size: 1.8rem; font-weight: 700; color: var(--text-primary); }
        
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 1rem;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: var(--success-color);
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 0 rgba(46, 204, 113, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease;
        }

        .card:hover { transform: translateY(-2px); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        .metric-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .progress-container {
            margin-top: 1rem;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 0.25rem;
        }

        .progress-bar-bg {
            background-color: #ecf0f1;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 0.5s ease-out;
        }

        .log-container {
            background: #2c3e50;
            color: #ecf0f1;
            border-radius: var(--border-radius);
            padding: 1rem;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.85rem;
            height: 300px;
            overflow-y: auto;
            box-shadow: var(--shadow);
        }

        .log-entry {
            margin-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.25rem;
        }

        .log-time { color: #95a5a6; margin-right: 8px; }
        .log-info { color: #3498db; }
        .log-success { color: #2ecc71; }
        .log-warn { color: #f1c40f; }
        .log-error { color: #e74c3c; }

        .refresh-timer {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #bbb; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <header>
        <div>
            <h1>Myles AI Runtime</h1>
            <span style="color: var(--text-secondary); font-size: 0.9rem;">System Status & Job Monitoring</span>
        </div>
        <div class="status-badge">
            <div class="pulse-dot"></div>
            <span id="system-status-text">Initializing...</span>
        </div>
    </header>

    <div class="grid">
        <!-- System Metrics Card -->
        <div class="card">
            <div class="card-header">
                <span>System Load</span>
                <span id="cpu-icon">🔥</span>
            </div>
            <div class="metric-value" id="cpu-metric">--%</div>
            <div class="progress-container">
                <div class="progress-label">
                    <span>CPU Usage</span>
                    <span id="cpu-percent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="cpu-bar" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Memory Usage Card -->
        <div class="card">
            <div class="card-header">
                <span>Memory Pool</span>
                <span id="ram-icon">💧</span>
            </div>
            <div class="metric-value" id="ram-metric">-- GB</div>
            <div class="progress-container">
                <div class="progress-label">
                    <span>Available Memory</span>
                    <span id="ram-percent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="ram-bar" style="width: 0%; background-color: var(--success-color);"></div>
                </div>
            </div>
        </div>

        <!-- Active Jobs Card -->
        <div class="card">
            <div class="card-header">
                <span>Active Jobs</span>
                <span id="jobs-icon">⚡</span>
            </div>
            <div class="metric-value" id="active-jobs-count">0</div>
            <div style="margin-top: 1rem; font-size: 0.9rem; color: var(--text-secondary);">
                Queue Depth: <span id="queue-depth">0</span> tasks
            </div>
        </div>

        <!-- Recent Activity Log -->
        <div class="card" style="grid-column: 1 / -1;">
            <div class="card-header">
                <span>Recent Activity Log</span>
                <span id="log-icon">📜</span>
            </div>
            <div class="log-container" id="activity-log">
                <!-- Logs injected via JS -->
            </div>
            <div class="refresh-timer">Auto-refreshing every 5 seconds...</div>
        </div>
    </div>
</div>

<script>
    // Configuration
    const CONFIG = {
        endpoint: '/api/v1/status/feed', // Relative path assumed for Myles context
        refreshInterval: 5000,
        cacheBust: true
    };

    // DOM Elements
    const els = {
        statusText: document.getElementById('system-status-text'),
        cpuMetric: document.getElementById('cpu-metric'),
        cpuPercent: document.getElementById('cpu-percent'),
        cpuBar: document.getElementById('cpu-bar'),
        ramMetric: document.getElementById('ram-metric'),
        ramPercent: document.getElementById('ram-percent'),
        ramBar: document.getElementById('ram-bar'),
        activeJobs: document.getElementById('active-jobs-count'),
        queueDepth: document.getElementById('queue-depth'),
        logContainer: document.getElementById('activity-log')
    };

    // Helper to format time
    function formatTime(date) {
        return date.toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    // Helper to add log entry
    function addLog(message, type = 'info') {
        const div = document.createElement('div');
        div.className = 'log-entry';
        
        let colorClass = '';
        if (type === 'success') colorClass = 'log-success';
        else if (type === 'warn') colorClass = 'log-warn';
        else if (type === 'error') colorClass = 'log-error';

        div.innerHTML = `
            <span class="log-time">[${formatTime(new Date())}]</span>
            <span class="${colorClass}">${message}</span>
        `;
        
        els.logContainer.prepend(div);
        
        // Keep only last 50 logs
        if (els.logContainer.children.length > 50) {
            els.logContainer.lastChild.remove();
        }
    }

    // Fetch Data Function
    async function fetchStatus() {
        try {
            // Construct URL with cache busting
            const url = CONFIG.endpoint + (CONFIG.cacheBust ? `?t=${Date.now()}` : '');
            
            addLog(`Fetching status from ${url}...`, 'info');

            const response = await fetch(url);
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();
            updateDashboard(data);

        } catch (error) {
            console.error('Fetch error:', error);
            addLog(`Connection failed: ${error.message}. Showing cached data.`, 'warn');
            
            // Fallback to static mock data if fetch fails, to prevent blank screen
            const fallbackData = {
                status: 'online',
                cpu: 12,
                memory: 4.2,
                activeJobs: 3,
                queueDepth: 15,
                lastJob: { name: 'Image_Processor_v2', progress: 85, status: 'running' }
            };
            updateDashboard(fallbackData);
        }
    }

    // Update UI based on data
    function updateDashboard(data) {
        // Status Text
        els.statusText.textContent = data.status.toUpperCase();
        if (data.status === 'online') els.statusText.style.color = '#2ecc71';
        else if (data.status === 'degraded') els.statusText.style.color = '#f1c40f';
        else els.statusText.style.color = '#e74c3c';

        // CPU
        els.cpuMetric.textContent = `${data.cpu}%`;
        els.cpuPercent.textContent = `${data.cpu}%`;
        els.cpuBar.style.width = `${data.cpu}%`;
        
        // Color code CPU bar
        if (data.cpu > 80) els.cpuBar.style.backgroundColor = '#e74c3c';
        else if (data.cpu > 50) els.cpuBar.style.backgroundColor = '#f1c40f';
        else els.cpuBar.style.backgroundColor = '#2ecc71';

        // Memory
        els.ramMetric.textContent = `${data.memory} GB`;
        const memPercent = Math.round((data.memory / 32) * 100); // Assuming 32GB total for example
        els.ramPercent.textContent = `${memPercent}% used`;
        els.ramBar.style.width = `${memPercent}%`;

        // Jobs
        els.activeJobs.textContent = data.activeJobs;
        els.queueDepth.textContent = data.queueDepth;

        // Log recent activity if available in payload
        if (data.recentActivity && Array.isArray(data.recentActivity)) {
            data.recentActivity.forEach(item => {
                let type = 'info';
                if (item.status === 'completed') type = 'success';
                if (item.status === 'failed') type = 'error';
                if (item.status === 'running') type = 'warn';
                
                addLog(`${item.name}: ${item.status} (${item.progress || 0}%)`, type);
            });
        } else {
            // Add a generic heartbeat log
            addLog(`System heartbeat received. All systems nominal.`, 'success');
        }
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
        addLog('Dashboard initialized.', 'info');
        fetchStatus();
        
        // Set interval for live updates
        setInterval(fetchStatus, CONFIG.refreshInterval);
    });

</script>
</body>
</html>
